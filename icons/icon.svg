  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- thin gold frame like a hymnbook cover -->
  <rect x="44" y="44" width="424" height="424" rx="64" fill="none" stroke="#C9A54C" stroke-opacity=".55" stroke-width="5"/>
