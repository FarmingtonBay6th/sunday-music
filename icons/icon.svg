  </g>
  <!-- open book -->
  <g fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 412 C 214 384, 160 378, 110 388 L 110 350"/>
    <path d="M256 412 C 298 384, 352 378, 402 388 L 402 350"/>
    <path d="M256 412 L 256 372"/>
    <path d="M256 384 C 218 360, 172 356, 134 362" stroke-width="7" stroke-opacity=".7"/>
